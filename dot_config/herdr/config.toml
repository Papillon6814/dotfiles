# tmux（Zellij 互換モーダル設定）に寄せたキー設定。2026-09-19
# herdr はプレフィックスが1つ・1アクションで抜ける仕様なので、pane モード相当だけ prefix に写している。
# 戻すときは config.toml.bak-20260919 か `herdr config reset-keys`。
[keys]
prefix = "ctrl+p"

# 直接キー（tmux の bind -n と同じ）
focus_pane_left  = ["prefix+h", "ctrl+h"]
focus_pane_down  = ["prefix+j", "ctrl+j"]
focus_pane_up    = ["prefix+k", "ctrl+k"]
focus_pane_right = ["prefix+l", "ctrl+l"]
previous_tab = ["prefix+p", "ctrl+shift+h"]
next_tab     = ["prefix+n", "ctrl+shift+l"]

# resize モードは居続けるので、tmux / Zellij と同じ入口にする
resize_mode = "ctrl+n"

# tmux の pane モード（Ctrl+p → ...）と同じキー順
split_vertical   = ["prefix+v", "prefix+ctrl+l"]
split_horizontal = ["prefix+minus", "prefix+ctrl+j"]
zoom        = ["prefix+z", "prefix+f"]
rename_pane = ["prefix+shift+p", "prefix+r"]

[[keys.command]]
key = "prefix+shift+r"
type = "plugin_action"
command = "herdr-agent-quota.refresh"
description = "refresh all agent quotas"

[[keys.command]]
key = "prefix+shift+q"
type = "plugin_action"
command = "herdr-agent-quota.open-settings"
description = "open agent quota settings"

# plannotator/herdr-annotate（README の推奨キーのまま）。2026-09-22
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+ctrl+a"
type = "plugin_action"
command = "annotate.copy-archive"
description = "copy annotations as context and archive them"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "review the agent's last reply"

[[keys.command]]
key = "prefix+ctrl+o"
type = "plugin_action"
command = "annotate.last-newest"
description = "review the agent's newest reply"
